[workspace]
members = ["crates/signer-core", "crates/signer-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
authors = ["Jose Storopoli <jose@storopoli.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/storopoli/yubikey-evm-signer"
categories = ["cryptography::cryptocurrencies"]
keywords = ["crypto", "evm", "yubikey", "secp256r1"]

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "deny"
rust.unused_must_use = "deny"
rust.unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage, coverage_nightly)',
] }
rust.missing_docs = "warn"
rustdoc.all = "warn"
clippy.too_long_first_doc_paragraph = "warn"
clippy.missing_const_for_fn = "warn"

[workspace.dependencies]
# Crypto (RustCrypto)
aes = "0.8.4"
des = "0.8.1"
p256 = "0.14.0"

# Ethereum (Alloy)
alloy-primitives = { version = "1.7.3", default-features = false, features = [
  "serde",
  "rlp",
] }
alloy-rlp = { version = "0.3.17", features = ["derive"] }

# WASM
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"

# Utils
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = "1.9.2"

[profile.release]
opt-level = "z"   # Optimized for size, use 3 for speed
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Reduced to increase optimizations
panic = "abort"   # Abort on panic
strip = "symbols" # Strip symbols from binary
