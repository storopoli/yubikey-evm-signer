name: Automated GitHub Actions Security Analysis with zizmor 🌈

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  zizmor:
    name: zizmor latest via PyPI
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read # only needed for private repos
      actions: read # only needed for private repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run zizmor 🌈
        id: zizmor
        continue-on-error: true
        run: |
          status=0
          uvx zizmor --format sarif . > results.sarif.tmp || status=$?
          if [ -s results.sarif.tmp ]; then
            mv results.sarif.tmp results.sarif
          else
            rm -f results.sarif.tmp
          fi
          exit "$status"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail if zizmor reported findings
        if: always()
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          if [ "$ZIZMOR_OUTCOME" != "success" ] || [ ! -s results.sarif ]; then
            exit 1
          fi
          findings=$(jq '[.runs[]?.results[]? | select((.suppressions // []) | length == 0)] | length' results.sarif)
          if [ "$findings" -gt 0 ]; then
            echo "zizmor reported $findings finding(s)" >&2
            exit 1
          fi
