name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify-version:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against Cargo workspace and npm package versions
        # GITHUB_REF_NAME is the pushed tag (e.g. v1.2.3); read from the environment, never interpolated.
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          errors = []

          with open("Cargo.toml", "rb") as f:
              workspace = tomllib.load(f)["workspace"]
          cargo_version = workspace["package"]["version"]
          if cargo_version != expected:
              errors.append(f"Cargo.toml [workspace.package] version is {cargo_version}")

          for member in workspace["members"]:
              with open(f"{member}/Cargo.toml", "rb") as f:
                  manifest = tomllib.load(f)
              version = manifest["package"]["version"]
              if version != {"workspace": True} and version != expected:
                  errors.append(f"{member}/Cargo.toml version is {version}")
              for name, dep in manifest.get("dependencies", {}).items():
                  if name.startswith("yubikey-evm-signer-") and isinstance(dep, dict) and "path" in dep:
                      if dep.get("version") != expected:
                          errors.append(f"{member}/Cargo.toml dependency {name} requires version {dep.get('version')}")

          with open("packages/npm/package.json", encoding="utf-8") as f:
              npm_version = json.load(f)["version"]
          if npm_version != expected:
              errors.append(f"packages/npm/package.json version is {npm_version}")

          if errors:
              print(f"Tag {tag} expects version {expected}, but:", file=sys.stderr)
              for error in errors:
                  print(f"  - {error}", file=sys.stderr)
              sys.exit(1)
          print(f"Tag {tag} matches Cargo workspace and npm package version {expected}")
          EOF

  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Run tests (unit and doc tests, all features)
        run: cargo test --workspace --all-features --locked

  github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-version, test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cratesio:
    name: Publish ${{ matrix.package }} to Crates.io
    runs-on: ubuntu-latest
    needs: [verify-version, test]
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io Trusted Publishing
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package:
          - yubikey-evm-signer-core
          - yubikey-evm-signer-wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Authenticate with crates.io (Trusted Publishing)
        # Exchanges the workflow's OIDC token for a publish token that expires after 30 minutes
        # and is revoked when the job ends. Each crate must list this workflow as a trusted
        # publisher in its crates.io settings.
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish -p "$PACKAGE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "Publish attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done
        env:
          PACKAGE: ${{ matrix.package }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: Publish Release to NPM
    runs-on: ubuntu-latest
    needs: [verify-version, test]
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing and provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted Publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Build WASM package
        # --no-opt skips wasm-opt which doesn't support bulk-memory ops from Rust 2024 edition
        run: |
          wasm-pack build crates/signer-wasm --target web --release --no-opt --out-dir ../../packages/npm/dist --out-name yubikey_evm_signer_wasm
          rm -f packages/npm/dist/.gitignore packages/npm/dist/package.json

      - name: Copy license files into the npm package
        run: cp LICENSE-MIT LICENSE-APACHE packages/npm/

      - name: Install dependencies
        working-directory: packages/npm
        run: npm ci

      - name: Verify demo integrity, WASM exports and npm package layout
        run: node scripts/verify-demo.mjs --check-wasm

      - name: Verify npm package contents
        working-directory: packages/npm
        run: |
          pack_output="$(npm pack --dry-run 2>&1)"
          echo "$pack_output"
          echo "$pack_output" | grep -Fq "dist/yubikey_evm_signer_wasm.js"
          echo "$pack_output" | grep -Fq "dist/yubikey_evm_signer_wasm_bg.wasm"
          echo "$pack_output" | grep -Fq "dist/yubikey_evm_signer_wasm.d.ts"
          echo "$pack_output" | grep -Fq "LICENSE-MIT"
          echo "$pack_output" | grep -Fq "LICENSE-APACHE"

      - name: Check that npm supports Trusted Publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is too old for Trusted Publishing (needs >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Publish to NPM
        # No token: npm authenticates with the workflow's OIDC identity. The package must list this
        # workflow as a trusted publisher with `npm publish` allowed in its npmjs.com settings.
        working-directory: packages/npm
        run: npm publish --provenance --access public
